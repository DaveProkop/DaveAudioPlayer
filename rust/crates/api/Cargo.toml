[package]
# cargokit names the built library after the package, so it must match the
# underscore library name (dap_api.dll / libdap_api.so).
name = "dap_api"
description = "Thin facade exposed to Flutter via flutter_rust_bridge"
version.workspace = true
# The generated bridge code (frb_generated.rs) targets edition 2021.
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
dap-analysis = { version = "0.2.0", path = "../analysis" }
dap-dsp = { version = "0.2.0", path = "../dsp" }
dap-engine = { version = "0.2.0", path = "../engine" }
dap-library = { version = "0.2.0", path = "../library" }
dap-metadata = { version = "0.2.0", path = "../metadata" }
dap-tags = { version = "0.2.0", path = "../tags" }
flutter_rust_bridge = "=2.13.0"
rusqlite = "0.42.0"

# Windows media controls (SMTC): media keys and the "now playing" flyout.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[target.'cfg(windows)'.dev-dependencies]
# The tests look our session up the way Windows itself does.
windows = { version = "0.62.2", features = ["Foundation_Collections", "Media_Control"] }

# cpal's AAudio backend reaches Android's AudioManager through ndk-context, which the
# app initializes from MainActivity (see src/android.rs). Both are already in the tree.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4.1"
ndk-context = "0.1.1"
