[package]
name = "dap-library"
description = "Folder scanner, SQLite library, full-text search and playlists"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
dap-analysis = { version = "0.1.0", path = "../analysis" }
dap-tags = { version = "0.1.0", path = "../tags" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
walkdir = "2.5.0"

[dev-dependencies]
lofty = "0.25.5"
